name: SE-04 MCP onboarding cloud qualification
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/se-04-cloud-onboarding-bff-20261108]
permissions:
  contents: read
jobs:
  check-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun x tsc --project packages/tsconfig.json
      - run: bun run build
      - run: bun test ./apps/editor/unit/mcp
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun x playwright install chromium --with-deps
        working-directory: apps/editor
      - run: bun x playwright test --config ./playwright.config.ts ./tests/mcp-onboarding.spec.ts
        working-directory: apps/editor
