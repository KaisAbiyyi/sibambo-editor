name: MCP modeling WP4 CP4 geometry
# Why two Bun versions: the repository's other workflows pin Bun 1.3.0 but never run apps/editor/unit/arch. Bun 1.3.0 lacks
# DecompressionStream('deflate'), so the PRE-EXISTING WP1A test unit/arch/admission-e-l2.test.ts (T-A2: WRITE -> OPEN) fails on it
# at the base commit 5606f26 as well ("Deflate decompression APIs are unavailable."). That is a runtime limit, not a WP4 defect.
#  - Bun 1.4.4: the FULL suite must pass (every legacy test, nothing skipped).
#  - Bun 1.3.0: every WP4 test file, named explicitly below, must pass. No test is skipped inside a suite.
on:
  pull_request:
  push:
    branches: [work/mcp-modeling-001/wp4-kernel-walls]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cp4:
    name: cp4 (${{ matrix.os }}, bun ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        bun: ['1.4.4', '1.3.0']
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" && echo "tested source $EXPECTED_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Full Editor units, legacy regressions included (Bun 1.4.4)
        if: matrix.bun == '1.4.4'
        run: bun test ./apps/editor/unit/authoring ./apps/editor/unit/arch ./apps/editor/unit/mcp ./apps/editor/unit/editor ./apps/editor/unit/agent
      - name: Every WP4 test file (Bun 1.3.0)
        if: matrix.bun == '1.3.0'
        shell: bash
        run: |
          bun test \
            ./apps/editor/unit/arch/sha256.test.ts \
            ./apps/editor/unit/arch/kernel.test.ts \
            ./apps/editor/unit/arch/kernel-faults.test.ts \
            ./apps/editor/unit/arch/walls.test.ts \
            ./apps/editor/unit/arch/walls-fuzz.test.ts \
            ./apps/editor/unit/arch/walls-staggered.test.ts \
            ./apps/editor/unit/arch/walls-deviation.test.ts \
            ./apps/editor/unit/arch/elements.test.ts \
            ./apps/editor/unit/arch/golden-cp4.test.ts \
            ./apps/editor/unit/arch/connectivity.test.ts
      - name: Production build
        if: matrix.bun == '1.4.4'
        run: bun run build
      - name: G10 digests under this Bun
        working-directory: apps/editor
        run: bun unit/arch/fixtures/verify-g10.ts
      - name: G10 digests under Node (same pinned hashes)
        if: matrix.bun == '1.4.4'
        working-directory: apps/editor
        shell: bash
        run: |
          node --version
          bun build unit/arch/fixtures/verify-g10.ts --target=node --outfile=verify-g10.mjs --external manifold-3d
          node verify-g10.mjs
