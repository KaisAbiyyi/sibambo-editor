name: BMB-027 Builder preview seam
on:
  pull_request:
    branches:
      - feature/bmb026-original-editor-consumer-20261106
    paths:
      - 'apps/editor/**'
      - 'docs/integrations/**'
      - 'docs/architecture.md'
      - 'README.md'
      - '.github/workflows/bmb027-builder-preview.yml'
  push:
    branches:
      - work/bmb-027/builder-preview-seam-20261107
permissions:
  contents: read
jobs:
  editor-check-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - name: Install pinned workspace
        run: bun install --frozen-lockfile
      - name: Svelte and TypeScript checks
        run: bun run check
      - name: Shared package types
        run: bun x tsc --project packages/tsconfig.json
      - name: Production build
        run: bun run build
  builder-preview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - name: Install pinned workspace
        run: bun install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: bun x playwright install chromium --with-deps
        working-directory: apps/editor
      - name: Builder preview browser acceptance
        run: bun x playwright test --config ./playwright.config.ts ./tests/bmb027-builder-preview.spec.ts
        working-directory: apps/editor
