name: SE-05 cross-repository live draft
on:
  pull_request:
    branches: [main]
  push:
    branches: [work/se-05/full-sync-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EXPECTED_EDITOR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BUILDER_SHA: eb28489ab8504e96eb1dde36f6bb1dce2d83eca4
      SE05_BUILDER_ROOT: ${{ github.workspace }}/builder
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: editor
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KaisAbiyyi/sibambo-bomc-builder
          ref: eb28489ab8504e96eb1dde36f6bb1dce2d83eca4
          path: builder
          persist-credentials: false
      - name: Exact source identities and isolated artifacts
        shell: bash
        run: |
          test "$(git -C editor rev-parse HEAD)" = "$EXPECTED_EDITOR_SHA"
          test "$(git -C builder rev-parse HEAD)" = "$EXPECTED_BUILDER_SHA"
          mkdir -p "$RUNNER_TEMP/se05-temp"
          for key in TEMP TMP; do echo "$key=$RUNNER_TEMP/se05-temp" >> "$GITHUB_ENV"; done
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/se05-temp/pip-cache" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/se05-temp/pycache" >> "$GITHUB_ENV"
          echo "SE05_OUTPUT_ROOT=$RUNNER_TEMP/se05-integration" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/se05-browsers" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/se05-bun-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Hash-locked service dependencies
        run: python -m pip install --require-hashes -r builder/service/requirements.lock
      - run: bun install --frozen-lockfile
        working-directory: editor
      - name: Public schema byte identity and static worker validator
        run: bun tooling/testing/generate-draft-validator.ts --check
        working-directory: editor
      - name: Portable unit regressions
        run: bun run check && bun test ./apps/editor/unit/mcp ./apps/editor/unit/editor
        working-directory: editor
      - name: Install browser
        run: bun x playwright install chromium --with-deps
        working-directory: editor
      - name: Real production BFF, TLS WebSocket, worker, atomic viewport and completed frame ACK
        run: bun tooling/testing/run-se05.ts
        working-directory: editor
      - name: Default Windows PowerShell helper
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: editor
        run: ./tooling/testing/se05-acceptance.ps1 -BuilderRoot "$env:SE05_BUILDER_ROOT" -EvidenceDir "$env:RUNNER_TEMP\se05-owner-ps51"
      - name: Upload synthetic integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se05-live-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/se05-integration/run.json
            ${{ runner.temp }}/se05-integration/browser-results.json
            ${{ runner.temp }}/se05-integration/browser-artifacts
            ${{ runner.temp }}/se05-owner-ps51/result.txt
            ${{ runner.temp }}/se05-owner-ps51/integration/run.json
            ${{ runner.temp }}/se05-owner-ps51/integration/browser-results.json
          if-no-files-found: error
          retention-days: 14
