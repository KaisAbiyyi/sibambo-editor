name: WP5 Linux WSL2 Qualification
# Self-hosted Linux (Ubuntu 24.04 on WSL2) qualification for SIB-MCP-MODELING-001 WP5.
# Mirrors the Linux legs of .github/workflows/mcp-modeling-wp5.yml (Bun 1.4.4 full, Bun 1.3.0 reduced)
# without reducing coverage. Jobs run strictly sequentially on the single runner labelled `sibambo-wsl2`.
# Deliberately NOT triggered by `pull_request`: a self-hosted runner must only execute trusted,
# owner-controlled code (push to the WP5 branch / manual dispatch by a repository writer).
on:
  push:
    branches: [work/mcp-modeling-001/wp5-topology-bake]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wp5-linux-wsl2
  cancel-in-progress: false
env:
  EXPECTED_SHA: ${{ github.sha }}
jobs:
  linux-bun-1-4-4:
    name: Linux WSL2 - Bun 1.4.4 (full)
    runs-on: [self-hosted, Linux, X64, sibambo-wsl2]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "tested source $EXPECTED_SHA"
          uname -srm
          grep PRETTY_NAME /etc/os-release
          nproc
          free -m | head -2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Toolchain versions
        shell: bash
        run: |
          bun --version | tee /dev/stderr | grep -qx '1.4.4'
          node --version | tee /dev/stderr | grep -qx 'v22.20.0'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Full Editor units, legacy regressions included
        run: bun test ./apps/editor/unit/authoring ./apps/editor/unit/arch ./apps/editor/unit/mcp ./apps/editor/unit/editor ./apps/editor/unit/agent
      - name: Production build
        run: bun run build
      - name: G10 CP4 & CP5 digests under Bun 1.4.4
        working-directory: apps/editor
        shell: bash
        run: |
          bun unit/arch/fixtures/verify-g10.ts
          bun unit/arch/fixtures/verify-g10-cp5.ts > "$RUNNER_TEMP/g10-cp5-bun.json"
          cat "$RUNNER_TEMP/g10-cp5-bun.json"
      - name: G10 CP4 & CP5 digests under Node (Bun-Node comparison)
        working-directory: apps/editor
        shell: bash
        run: |
          node --version
          bun build unit/arch/fixtures/verify-g10.ts --target=node --outfile=verify-g10.mjs --external manifold-3d
          node verify-g10.mjs
          bun build unit/arch/fixtures/verify-g10-cp5.ts --target=node --outfile=verify-g10-cp5.mjs --external manifold-3d
          node verify-g10-cp5.mjs --compare "$RUNNER_TEMP/g10-cp5-bun.json"

  linux-bun-1-3-0:
    name: Linux WSL2 - Bun 1.3.0 (reduced)
    # Strictly after the 1.4.4 job; always() so a failure of the first job does not hide the second result.
    needs: linux-bun-1-4-4
    if: ${{ always() }}
    runs-on: [self-hosted, Linux, X64, sibambo-wsl2]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "tested source $EXPECTED_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - name: Toolchain versions
        shell: bash
        run: bun --version | tee /dev/stderr | grep -qx '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: WP4 + WP5 arch test files (Bun 1.3.0)
        shell: bash
        run: |
          bun test \
            ./apps/editor/unit/arch/sha256.test.ts \
            ./apps/editor/unit/arch/kernel.test.ts \
            ./apps/editor/unit/arch/kernel-faults.test.ts \
            ./apps/editor/unit/arch/walls.test.ts \
            ./apps/editor/unit/arch/walls-fuzz.test.ts \
            ./apps/editor/unit/arch/walls-staggered.test.ts \
            ./apps/editor/unit/arch/walls-deviation.test.ts \
            ./apps/editor/unit/arch/elements.test.ts \
            ./apps/editor/unit/arch/golden-cp4.test.ts \
            ./apps/editor/unit/arch/connectivity.test.ts \
            ./apps/editor/unit/arch/cp5-gates-manifest.test.ts \
            ./apps/editor/unit/arch/topology-cp5.test.ts
      - name: G10 CP4 & CP5 digests under Bun 1.3.0
        working-directory: apps/editor
        shell: bash
        run: |
          bun unit/arch/fixtures/verify-g10.ts
          bun unit/arch/fixtures/verify-g10-cp5.ts > "$RUNNER_TEMP/g10-cp5-bun.json"
          cat "$RUNNER_TEMP/g10-cp5-bun.json"
