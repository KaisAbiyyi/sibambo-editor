name: BMB-026 original Editor E4 consumer
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/e4-import/**'
      - 'packages/bomc-document/**'
      - 'scripts/bmb026-verify-provenance.py'
      - '.github/workflows/bmb026-original-editor.yml'
  push:
    branches: [feature/bmb026-original-editor-consumer-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-consumer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      BMB021_BUILDER_DIR: ${{ github.workspace }}/bmb021-public
      BMB021_RUBY_FIXTURE_DIR: ${{ github.workspace }}/packages/e4-import/src/bmb021-fixtures/ruby-original
      EXPECTED_CONSUMER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KaisAbiyyi/sibambo-bomc-builder
          ref: 8fc6ebbeb1996889983bd6fff0958d1f9a7aaf00
          path: bmb026-builder
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KaisAbiyyi/sibambo-bomc-builder
          ref: 0e3ec262e98762969da66088d412f8beebb63523
          path: bmb021-public
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source, original fixture digests and deterministic reproduction
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONSUMER_SHA"
          test "$(git -C bmb021-public rev-parse HEAD)" = 0e3ec262e98762969da66088d412f8beebb63523
          python scripts/bmb026-verify-provenance.py bmb026-builder
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - name: Install pinned original consumer workspace
        run: bun install --frozen-lockfile
      - name: Real BMB-026 import and unchanged BMB-021 positive/negative regressions
        run: bun test --preload ./packages/e4-import/src/bmb021-browser-test-stream.ts packages/e4-import/src/bmb026-house-consumer.test.ts packages/e4-import/src/bmb021-original-consumer.test.ts packages/e4-import/src/bmb021-compatibility.test.ts packages/e4-import/src/bmb021-geometry.test.ts packages/e4-import/src/bomc-materials-v2.test.ts packages/e4-import/src/resource-limits.test.ts packages/bomc-document/src/bmb021-strict-editable.test.ts packages/bomc-document/src/roundtrip.test.ts
      - name: Original Editor app check
        run: bun run check
      - name: Shared package types
        run: bun x tsc --project packages/tsconfig.json
      - name: Original Editor build
        run: bun run build
      - name: Record evidence boundaries
        if: always()
        shell: bash
        run: |
          echo "Exact Editor candidate: $EXPECTED_CONSUMER_SHA; base b5f46a761d1763241b60375cbb5f7110d62d99d2" >> "$GITHUB_STEP_SUMMARY"
          echo 'Builder exact source: 8fc6ebbeb1996889983bd6fff0958d1f9a7aaf00; original run 42036423066.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production BomcLoader.load; baseline/revised binary digests checked before import; source faces 278, analytical faces 66, five modules, real seam/door/window geometry and localized revision asserted.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Viewing only: no section 241 editable claim. Persistent journal, owner visual acceptance, native SketchUp, independent review and merge remain separate gates.' >> "$GITHUB_STEP_SUMMARY"
