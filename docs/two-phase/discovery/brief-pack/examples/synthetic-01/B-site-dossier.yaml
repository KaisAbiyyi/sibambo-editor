hazards:
  earthquake: { value: "tidak dinilai", evidence: missing }

attachments: []

synthesis:
  opportunities:
    - "Sisi belakang (utara) terbuka dan berpemandangan."
    - "Jalan sepi; teras depan aman dipakai."
  constraints:
    - "Dinding kiri dan kanan tertutup: cahaya hanya dari depan, belakang, atau taman dalam."
    - "Lebar 9 m membatasi jumlah ruang berjajar."
    - "Tetangga kiri 2 lantai membayangi sisi barat pada sore hari."
  critical_missing:
    - "KRK atau dokumen aturan perumahan (KDB, KDH, sempadan belakang belum bersumber)."
    - "Arah hadap belum diukur (±15°)."
    - "Data tanah."
