  street_parking: { value: false, evidence: user-stated, by: client }

utilities:
  electricity: { value: "tersedia; tiang di sudut kiri-depan", evidence: user-stated, by: client }
  water: { value: "PDAM; meter di depan", evidence: user-stated, by: client }
