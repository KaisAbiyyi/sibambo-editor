# SINTETIS — kavling karangan. Bukan lokasi, dokumen, atau regulasi nyata.
schema: brief-pack/site-dossier@0
project_id: syn-01-rumah-deret-9x16
capture_level: lot
prepared_by_role: client
site_visit: { done: false }
frame: "meter lokal; titik 0 = sudut kiri-depan dilihat dari jalan; +X sepanjang muka kavling; +Y ke dalam kavling; +Z ke atas"

location:
